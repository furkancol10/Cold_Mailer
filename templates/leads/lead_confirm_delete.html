{% extends "base.html" %}

{% block title %}Lead Sil — SmartReach{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="bg-white rounded-xl shadow-sm border border-red-100 p-8 text-center">
        <div class="text-4xl mb-4">⚠️</div>
        <h1 class="text-xl font-bold text-gray-900 mb-2">Silmek istediğinize emin misiniz?</h1>
        <p class="text-gray-500 text-sm mb-6">
            <strong>{{ lead.full_name }}</strong> ({{ lead.email }}) kalıcı olarak silinecek.
            Bu işlem geri alınamaz.
        </p>
        <div class="flex justify-center gap-4">
            <form method="post">
                {% csrf_token %}
                <button type="submit"
                        class="bg-red-600 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-red-700">
                    Evet, Sil
                </button>
            </form>
            <a href="{% url 'lead_list' %}"
               class="bg-white border border-gray-300 text-gray-700 px-6 py-2 rounded-lg text-sm hover:bg-gray-50">
                İptal
            </a>
        </div>
    </div>
</div>
{% endblock %}
